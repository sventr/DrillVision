[env:lilygo_t_rgb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_USE_LOG=1

lib_deps =
    lvgl/lvgl@^9.2.2
    lovyan03/LovyanGFX
    sparkfun/SparkFun BMI270 Arduino Library
    bblanchon/ArduinoJson@^7.0.4

board_build.filesystem = littlefs